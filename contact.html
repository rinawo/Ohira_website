        <!-- ヘッダーここまで -->>
            <h1 class="hero contact">お問い合わせ</h1>
        <!-- メイン -->>
       <main>
          <from action="result.html">
            <p>
                <label for="kind">お問い合わせの種類</label><br>
                <select name="kind" id="kind">
                    <option value="1">ファンレター</option>
                    <option value="2">お仕事について</option>
                    <option value="3">当サイトについて</option>
                    <option value="4">その他</option>
                </select>
            </p>
            <p>
                初めてのお問い合わせですか？<br>
                <input type="radio" name="first" value="yes" checked>はい<br>
                <input type="radio" name="first" value="no" checked>いいえ<br>
            </p>
            <p>
                大平裕心をお知りになったきっかけは？<br>
                <input type="checkbox" name="how" value="friend">お知り合いの紹介で<br>
                <input type="checkbox" name="how" value="magazine">SNS、webサイト、雑誌などを見て<br>
            </p>
            <p>
                お問い合わせの件名<br>
                <input type="text" name="subject" placeholder="タイトル">お知り合いの紹介で<br>
            </p>
            <p>
                お問い合わせの具体的な内容<br>
                <textarea name="message"></textarea>
            </p>
            <p class="submit">
                <input type="submit" value="送信">
            </p>
          </from>
       </main>
